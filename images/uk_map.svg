<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="auto" style="background:#f0f7ff; border-radius:16px;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="660" height="50" rx="10" fill="#0284c7" />
  <text x="350" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">MAP OF THE UNITED KINGDOM &amp; IRELAND</text>

  <!-- Scotland outline -->
  <path d="M 330 110 C 350 100, 390 120, 380 150 C 400 170, 390 210, 370 230 C 390 250, 380 280, 350 290 C 320 300, 300 290, 290 270 C 270 240, 280 200, 300 180 C 290 150, 310 120, 330 110 Z" 
        fill="url(#landGrad)" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)" />

  <!-- England and Wales outline -->
  <path d="M 350 290 C 390 320, 420 370, 440 430 C 470 480, 470 540, 440 600 C 410 650, 350 670, 270 650 C 240 630, 220 580, 250 530 C 240 500, 260 460, 280 430 C 270 380, 310 320, 350 290 Z" 
        fill="url(#landGrad)" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Ireland outline -->
  <path d="M 180 320 C 220 310, 240 350, 230 400 C 240 450, 220 500, 180 520 C 140 520, 120 480, 130 430 C 120 380, 150 330, 180 320 Z" 
        fill="url(#landGrad)" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,2" />

  <!-- Cities & Labels -->
  <!-- Scotland -->
  <g class="city" transform="translate(350, 160)">
    <circle cx="0" cy="0" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="12" y="5" font-family="sans-serif" font-size="14" font-weight="600" fill="#0f172a">Aberdeen</text>
  </g>

  <g class="city" transform="translate(310, 140)">
    <circle cx="0" cy="0" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="-10" y="-8" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="end">Inverness</text>
  </g>

  <g class="city" transform="translate(340, 205)">
    <circle cx="0" cy="0" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="10" y="4" font-family="sans-serif" font-size="12" fill="#334155">Dundee</text>
  </g>

  <g class="city" transform="translate(340, 250)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">1. Edinburgh (Kevin Smith)</text>
  </g>

  <g class="city" transform="translate(300, 260)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="-12" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">4. Glasgow (Sally Green)</text>
  </g>

  <!-- Northern Ireland -->
  <g class="city" transform="translate(195, 360)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="-12" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">8. Belfast (James Smith)</text>
  </g>

  <!-- Northern England -->
  <g class="city" transform="translate(365, 330)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">2. Newcastle (Sue Jenkins)</text>
  </g>

  <g class="city" transform="translate(340, 420)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="-3" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Leeds</text>
  </g>

  <g class="city" transform="translate(315, 430)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="-12" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">3. Liverpool (Peter White)</text>
  </g>

  <g class="city" transform="translate(340, 450)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">7. Manchester Univ. (Steve Hansen)</text>
  </g>

  <g class="city" transform="translate(355, 475)">
    <circle cx="0" cy="0" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="12" y="4" font-family="sans-serif" font-size="12" fill="#334155">Sheffield</text>
  </g>

  <!-- Midlands & Wales -->
  <g class="city" transform="translate(365, 510)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">9. Nottingham Univ. (Linda)</text>
  </g>

  <g class="city" transform="translate(330, 530)">
    <circle cx="0" cy="0" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="-12" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">Birmingham</text>
  </g>

  <g class="city" transform="translate(290, 570)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="-14" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">5. Cardiff (Richard Lee)</text>
  </g>

  <g class="city" transform="translate(400, 555)">
    <circle cx="0" cy="0" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">10. Cambridge Univ. (Chris)</text>
  </g>

  <g class="city" transform="translate(320, 580)">
    <circle cx="0" cy="0" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="-10" y="15" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="end">Bristol</text>
  </g>

  <!-- South -->
  <g class="city" transform="translate(390, 600)">
    <circle cx="0" cy="0" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="16" y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">6. London (Mary Snow)</text>
  </g>

  <g class="city" transform="translate(375, 640)">
    <circle cx="0" cy="0" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="10" y="4" font-family="sans-serif" font-size="12" fill="#334155">Brighton</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(30, 680)">
    <rect width="640" height="135" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7">Audio 05.mp3 — Shaharlar va Qahramonlar ko'rsatkichi:</text>
    <text x="20" y="60" font-family="sans-serif" font-size="13" fill="#334155">1. Edinburgh: Kevin Smith | 2. Newcastle: Sue Jenkins | 3. Liverpool: Peter White</text>
    <text x="20" y="85" font-family="sans-serif" font-size="13" fill="#334155">4. Glasgow: Sally Green | 5. Cardiff: Richard Lee | 6. London: Mary Snow</text>
    <text x="20" y="110" font-family="sans-serif" font-size="13" fill="#334155">7. Manchester: Steve Hansen | 8. Belfast: James Smith | 9. Nottingham: Linda | 10. Cambridge: Chris</text>
  </g>
</svg>